extends: existence
message: "Use 'select' or 'deselect' when referring to a checkbox. Avoid verbs like '%s'."
level: error
ignorecase: true
link: https://developer.salesforce.com/docs/atlas.en-us.salesforce_pubs_style_guide.meta/salesforce_pubs_style_guide/style_checkboxes.htm
tokens:
  - '(check|uncheck|mark|unmark|tick|untick)\s+the\s+(.*?)checkbox'