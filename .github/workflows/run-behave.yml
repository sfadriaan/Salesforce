name: Run Behave

on: [pull_request]

jobs:
  behave:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run Behave
        run: |
          make run-behave