name: Release

# Package the style and attach it to a GitHub Release whenever a version tag
# is pushed. Consumers install it with `vale sync` via the release asset URL:
#
#   Packages = https://github.com/sfadriaan/Salesforce/releases/latest/download/Salesforce.zip
#
# Cut a release by pushing a tag, for example:
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package style
        run: zip -r Salesforce.zip Salesforce -x "*.DS_Store"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: Salesforce.zip
          generate_release_notes: true
